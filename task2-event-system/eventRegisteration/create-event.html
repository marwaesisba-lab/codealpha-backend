<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Event</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <a href="index.html">← Home</a>

        <div class="form-card">

            <h1>Create Event</h1>

            <form id="eventForm">

                <label>
                    Title
                </label>

                <input type="text" id="title" placeholder="Cybersecurity Workshop" required>

                <label>
                    Description
                </label>

                <textarea id="description" placeholder="Workshop about cybersecurity..."></textarea>

                <label>
                    Date
                </label>

                <input type="date" id="date" required>

                <label>
                    Location
                </label>

                <input type="text" id="location" placeholder="ESI Sidi Bel Abbès" required>

                <button type="submit">
                    Create Event
                </button>

            </form>

            <div id="message"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
